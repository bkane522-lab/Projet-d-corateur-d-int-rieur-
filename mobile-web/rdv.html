<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-brand-title="Prendre rendez-vous">Prendre rendez-vous — Atelier de Plan</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173F35">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  .wrap{max-width:560px; margin:0 auto; padding:4rem 6vw 6rem;}
  .code-box{
    background:var(--pierre); border-radius:4px; padding:1.2rem 1.4rem;
    margin:1.5rem 0 2.5rem; font-size:0.9rem;
  }
  .code-box strong{font-family:'Space Mono', monospace; letter-spacing:0.05em;}
</style>
</head>
<body>

<nav class="top">
  <div class="brand" data-brand="nomCourt">Atelier de Plan</div>
</nav>

<div class="wrap">
  <div class="spine">
    <div class="spine-step done">01 Espace</div>
    <div class="spine-step done">02 Questionnaire</div>
    <div class="spine-step done">03 Dossier</div>
    <div class="spine-step active">04 RDV</div>
  </div>

  <h1 style="font-size:1.8rem;">Votre dossier est bien reçu</h1>
  <p style="color:var(--encre-soft); margin-top:0.6rem;">Proposez un ou deux créneaux, je confirme sous 48h.</p>

  <div class="code-box" id="code-box">
    Votre code de suivi : <strong id="code-display">…</strong><br>
    Conservez-le pour consulter l'avancement de votre dossier.
  </div>

  <form id="rdv-form">
    <div class="field">
      <label class="field-label">Créneau souhaité 1</label>
      <input type="datetime-local" id="creneau1" required>
    </div>
    <div class="field">
      <label class="field-label">Créneau souhaité 2 (optionnel)</label>
      <input type="datetime-local" id="creneau2">
    </div>
    <div class="field">
      <label class="field-label">Format</label>
      <div class="chip-select" data-name="lieu">
        <div class="chip selected">Sur site</div>
        <div class="chip">Visio</div>
        <div class="chip">Au cabinet</div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Envoyer mes disponibilités</button>
  </form>
  <p id="status-msg" style="margin-top:1rem; font-size:0.9rem; color:var(--encre-soft);"></p>
</div>

<script src="js/config.js"></script>
<script src="js/brand.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code') || localStorage.getItem('code_acces_dossier') || '—';
  document.getElementById('code-display').textContent = code;

  document.querySelectorAll('.chip-select').forEach(group => {
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        group.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
      });
    });
  });

  document.getElementById('rdv-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusMsg = document.getElementById('status-msg');
    statusMsg.textContent = 'Envoi en cours…';

    const lieu = document.querySelector('.chip-select[data-name="lieu"] .chip.selected')?.textContent || 'Sur site';
    const creneau1 = parisLocalToUTCISOString(document.getElementById('creneau1').value);
    const creneau2raw = document.getElementById('creneau2').value;
    const creneau2 = creneau2raw ? parisLocalToUTCISOString(creneau2raw) : null;

    try {
      await apiPost('/api/appointments', { code_acces: code, creneau1, creneau2, lieu });
      window.location.href = `suivi.html?code=${code}`;
    } catch (err) {
      statusMsg.textContent = err.message || "Une erreur est survenue lors de l'envoi de vos disponibilités.";
    }
  });
</script>

</body>
</html>
