<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-brand-title="Suivi de mon dossier">Suivi de mon dossier — Atelier de Plan</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173F35">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  .wrap{max-width:560px; margin:0 auto; padding:4rem 6vw 6rem;}
  .timeline{display:flex; flex-direction:column; gap:0; margin-top:2rem;}
  .tl-step{
    display:flex; gap:1rem; padding-bottom:1.6rem; position:relative;
  }
  .tl-step::before{
    content:''; position:absolute; left:9px; top:22px; bottom:0; width:1px; background:var(--ligne);
  }
  .tl-step:last-child::before{display:none;}
  .tl-dot{width:20px; height:20px; border-radius:50%; background:var(--pierre); border:2px solid var(--ligne); flex-shrink:0; margin-top:2px;}
  .tl-step.done .tl-dot{background:var(--sauge); border-color:var(--sauge);}
  .tl-step.current .tl-dot{background:var(--terre); border-color:var(--terre);}
  .tl-content h4{font-size:0.95rem;}
  .tl-content p{font-size:0.82rem; color:var(--encre-soft);}
  .code-entry{display:flex; gap:0.6rem; margin-bottom:2rem;}
  .code-entry input{flex:1;}
</style>
</head>
<body>

<nav class="top">
  <div class="brand" data-brand="nomCourt">Atelier de Plan</div>
</nav>

<div class="wrap">
  <h1 style="font-size:1.8rem;">Suivi de mon dossier</h1>

  <div class="code-entry" id="code-entry" style="margin-top:1.5rem;">
    <input type="text" id="code-input" placeholder="Votre code de suivi">
    <button class="btn btn-outline" id="btn-check">Consulter</button>
  </div>

  <div id="result" style="display:none;">
    <p class="label" id="statut-label"></p>
    <div class="timeline" id="timeline"></div>
  </div>
  <p id="error-msg" style="color:var(--encre-soft); font-size:0.9rem;"></p>
</div>

<script src="js/config.js"></script>
<script src="js/brand.js"></script>
<script src="js/app.js"></script>
<script>
  const PIPELINE = ['Nouveau', 'À analyser', 'À contacter', 'Rendez-vous programmé', 'Proposition envoyée', 'Signé'];

  const STEP_DESC = {
    'Nouveau': "Votre dossier a bien été reçu.",
    'À analyser': "Le dossier est en cours d'étude.",
    'À contacter': "Une prise de contact est prévue prochainement.",
    'Rendez-vous programmé': "Votre rendez-vous est confirmé.",
    'Proposition envoyée': "Une proposition vous a été envoyée.",
    'Signé': "Le projet est lancé !"
  };

  async function loadStatus(code) {
    const errorMsg = document.getElementById('error-msg');
    const result = document.getElementById('result');
    errorMsg.textContent = '';
    try {
      const data = await apiGet(`/api/dossiers?code=${encodeURIComponent(code)}`);
      renderTimeline(data.statut);
      result.style.display = 'block';
      localStorage.setItem('code_acces_dossier', code);
    } catch (err) {
      result.style.display = 'none';
      errorMsg.textContent = "Dossier introuvable avec ce code. Vérifiez qu'il est correctement saisi.";
    }
  }

  function renderTimeline(statutActuel) {
    document.getElementById('statut-label').textContent = `Statut actuel — ${statutActuel}`;
    const idxActuel = PIPELINE.indexOf(statutActuel);
    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    PIPELINE.forEach((statut, idx) => {
      const step = document.createElement('div');
      step.className = 'tl-step ' + (idx < idxActuel ? 'done' : idx === idxActuel ? 'current' : '');
      step.innerHTML = `
        <div class="tl-dot"></div>
        <div class="tl-content">
          <h4>${statut}</h4>
          <p>${STEP_DESC[statut] || ''}</p>
        </div>
      `;
      timeline.appendChild(step);
    });
  }

  document.getElementById('btn-check').addEventListener('click', () => {
    const code = document.getElementById('code-input').value.trim();
    if (code) loadStatus(code);
  });

  // Pré-remplissage si un code est déjà connu (query param ou stockage local)
  const params = new URLSearchParams(window.location.search);
  const knownCode = params.get('code') || localStorage.getItem('code_acces_dossier');
  if (knownCode) {
    document.getElementById('code-input').value = knownCode;
    loadStatus(knownCode);
  }
</script>

</body>
</html>
