<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossiers reçus — Espace décoratrice</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .wrap{max-width:1000px; margin:0 auto; padding:2.5rem 6vw 5rem;}
  .filters{display:flex; gap:0.5rem; flex-wrap:wrap; margin:1.5rem 0 2rem;}
  .filters .chip{font-size:0.8rem;}
  .dossier-row{
    display:grid; grid-template-columns:1.6fr 1fr 1fr 0.8fr 1fr; gap:1rem; align-items:center;
    padding:1rem 1.2rem; background:var(--blanc); border:1px solid var(--ligne); border-radius:4px;
    margin-bottom:0.6rem; cursor:pointer; font-size:0.88rem;
  }
  .dossier-row:hover{border-color:var(--terre);}
  .dossier-row .name{font-weight:500;}
  .dossier-row .meta{color:var(--encre-soft); font-size:0.8rem;}
  .row-head{
    display:grid; grid-template-columns:1.6fr 1fr 1fr 0.8fr 1fr; gap:1rem;
    padding:0 1.2rem; margin-bottom:0.6rem; font-family:'Space Mono',monospace;
    font-size:0.7rem; text-transform:uppercase; color:var(--encre-soft); letter-spacing:0.05em;
  }
  @media(max-width:820px){
    .row-head{display:none;}
    .dossier-row{grid-template-columns:1fr; gap:0.4rem;}
  }
</style>
</head>
<body>

<nav class="top">
  <div class="brand" data-brand-line="Espace privé">Atelier de Plan — Espace privé</div>
  <a href="#" class="btn btn-outline" style="padding:0.5rem 1rem; font-size:0.8rem;" id="btn-logout">Déconnexion</a>
</nav>

<div class="wrap">
  <p class="label">Dossiers</p>
  <h1 style="margin-top:0.5rem;">Prospects & dossiers reçus</h1>

  <div class="filters" id="filters">
    <div class="chip selected" data-statut="">Tous</div>
    <div class="chip" data-statut="Nouveau">Nouveau</div>
    <div class="chip" data-statut="À analyser">À analyser</div>
    <div class="chip" data-statut="À contacter">À contacter</div>
    <div class="chip" data-statut="Rendez-vous programmé">RDV programmé</div>
    <div class="chip" data-statut="Proposition envoyée">Proposition envoyée</div>
    <div class="chip" data-statut="Signé">Signé</div>
    <div class="chip" data-statut="Archivé">Archivé</div>
  </div>

  <div class="row-head">
    <span>Nom / ville</span><span>Type</span><span>Budget</span><span>Statut</span><span>Reçu le</span>
  </div>

  <div id="dossier-list"></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/brand.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/session.js"></script>
<script>
  let currentFilter = '';

  async function loadDossiers() {
    const list = document.getElementById('dossier-list');
    list.innerHTML = '<p style="color:var(--encre-soft); font-size:0.9rem;">Chargement…</p>';
    try {
      const query = currentFilter ? `?statut=${encodeURIComponent(currentFilter)}` : '';
      const headers = await getAdminAuthHeaders();
      const data = await apiGet(`/api/dossiers${query}`, { headers });
      renderList(data.dossiers || []);
    } catch (err) {
      if (String(err.message).includes('Authentification') || String(err.message).includes('Session')) {
        window.location.href = 'login.html';
        return;
      }
      list.innerHTML = '<p style="color:var(--encre-soft); font-size:0.9rem;">Impossible de charger les dossiers pour le moment.</p>';
    }
  }

  const STATUT_CLASS = {
    'Nouveau': 'status-Nouveau',
    'À analyser': 'status-A_analyser',
    'À contacter': 'status-A_contacter',
    'Rendez-vous programmé': 'status-RDV_programme',
    'Proposition envoyée': 'status-Proposition_envoyee',
    'Signé': 'status-Signe',
    'Archivé': 'status-Archive'
  };

  function renderList(dossiers) {
    const list = document.getElementById('dossier-list');
    if (dossiers.length === 0) {
      list.innerHTML = '<p style="color:var(--encre-soft); font-size:0.9rem;">Aucun dossier pour ce filtre.</p>';
      return;
    }
    list.innerHTML = '';
    dossiers.forEach(d => {
      const row = document.createElement('div');
      row.className = 'dossier-row';
      row.onclick = () => window.location.href = `dossier.html?id=${d.id}`;
      const statutClass = STATUT_CLASS[d.statut] || 'status-Nouveau';
      row.innerHTML = `
        <div><div class="name">${escapeHtml(d.nom_prospect || 'Sans nom')}</div><div class="meta">${escapeHtml(d.ville || '')}</div></div>
        <div>${escapeHtml(d.type_logement || '—')}</div>
        <div>${escapeHtml(d.budget || '—')}</div>
        <div><span class="status-pill ${statutClass}">${escapeHtml(d.statut)}</span></div>
        <div class="meta">${new Date(d.created_at).toLocaleDateString('fr-FR')}</div>
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    if (!e.target.classList.contains('chip')) return;
    document.querySelectorAll('#filters .chip').forEach(c => c.classList.remove('selected'));
    e.target.classList.add('selected');
    currentFilter = e.target.dataset.statut;
    loadDossiers();
  });

  document.getElementById('btn-logout').addEventListener('click', (e) => {
    e.preventDefault();
    signOutAdmin();
  });

  (async () => {
    await requireAdminSession();
    loadDossiers();
  })();
</script>

</body>
</html>
