<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier — Espace décoratrice</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .wrap{max-width:960px; margin:0 auto; padding:2.5rem 6vw 5rem;}
  .layout{display:grid; grid-template-columns:1.6fr 1fr; gap:2rem;}
  @media(max-width:820px){ .layout{grid-template-columns:1fr;} }
  .block{margin-bottom:1.6rem;}
  .block h3{font-size:0.95rem; margin-bottom:0.8rem;}
  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:0.6rem;}
  .photo-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:3px; border:1px solid var(--ligne);}
  .photo-grid .placeholder{width:100%; aspect-ratio:1; background:var(--pierre); border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:var(--encre-soft); text-align:center; padding:0.3rem;}
  .info-line{display:flex; justify-content:space-between; font-size:0.9rem; padding:0.5rem 0; border-bottom:1px solid var(--ligne); gap:1rem;}
  .info-line span:first-child{color:var(--encre-soft);}
  .info-line span:last-child{text-align:right; font-weight:500;}
  .ia-actions{display:flex; flex-wrap:wrap; gap:0.6rem; margin-bottom:1rem;}
  .ia-actions button{font-size:0.8rem; padding:0.6rem 1rem;}
  .ia-box{background:var(--pierre); border-radius:4px; padding:1rem 1.2rem; font-size:0.88rem; margin-top:0.6rem; white-space:pre-wrap;}
  .notes-history{display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1rem; max-height:220px; overflow-y:auto;}
  .note-entry{font-size:0.82rem; background:var(--pierre); border-radius:3px; padding:0.6rem 0.8rem;}
  .note-entry .date{font-size:0.7rem; color:var(--encre-soft); display:block; margin-bottom:0.2rem;}
  .doc-row{
    display:flex; align-items:center; justify-content:space-between; gap:0.8rem;
    background:var(--blanc); border:1px solid var(--ligne); border-radius:4px;
    padding:0.8rem 1rem; margin-bottom:0.6rem;
  }
  .doc-row .doc-info{display:flex; flex-direction:column; gap:0.2rem;}
  .doc-row .doc-name{font-size:0.9rem; font-weight:500;}
  .doc-row .doc-meta{font-size:0.75rem; color:var(--encre-soft); font-family:'Space Mono',monospace;}
  .doc-row a.doc-action{font-size:0.8rem; white-space:nowrap;}
</style>
</head>
<body>

<nav class="top">
  <div class="brand" data-brand-line="Espace privé">Atelier de Plan — Espace privé</div>
  <a href="dashboard.html" class="btn btn-outline" style="padding:0.5rem 1rem; font-size:0.8rem;">← Retour</a>
</nav>

<div class="wrap">
  <p class="label" id="dossier-date"></p>
  <h1 id="dossier-nom" style="margin-top:0.5rem;">Chargement…</h1>

  <div class="layout" style="margin-top:2rem;">
    <div>
      <div class="block">
        <h3>Photos</h3>
        <div class="photo-grid" id="photo-grid"></div>
      </div>

      <div class="block">
        <h3>Mesures</h3>
        <div id="mesures-block"></div>
      </div>

      <div class="block">
        <h3>Plans et documents</h3>
        <div class="documents-list" id="documents-list"></div>
      </div>

      <div class="block">
        <h3>Informations du projet</h3>
        <div id="infos-block"></div>
      </div>

      <div class="block">
        <h3>Assistance IA <span style="font-size:0.75rem; font-weight:400; color:var(--encre-soft);">— n'invente aucune dimension, ne diagnostique jamais la structure</span></h3>
        <div class="ia-actions">
          <button class="btn btn-outline" data-action="resume">Résumé du besoin</button>
          <button class="btn btn-outline" data-action="questions_rdv">Questions 1er RDV</button>
          <button class="btn btn-outline" data-action="infos_manquantes">Infos manquantes</button>
          <button class="btn btn-outline" data-action="incoherences">Incohérences mesures</button>
          <button class="btn btn-outline" data-action="classification">Type d'accompagnement</button>
        </div>
        <div class="ia-box" id="ia-box" style="display:none;"></div>
      </div>
    </div>

    <div>
      <div class="block card">
        <h3>Statut</h3>
        <select id="statut-select">
          <option>Nouveau</option>
          <option>À analyser</option>
          <option>À contacter</option>
          <option>Rendez-vous programmé</option>
          <option>Proposition envoyée</option>
          <option>Signé</option>
          <option>Archivé</option>
        </select>
      </div>

      <div class="block card">
        <h3>Prochaine action</h3>
        <textarea id="prochaine-action" placeholder="Ex: rappeler mardi, envoyer proposition…"></textarea>
      </div>

      <div class="block card">
        <h3>Notes privées</h3>
        <div class="notes-history" id="notes-history"></div>
        <textarea id="notes" placeholder="Ajouter une nouvelle note (les précédentes restent conservées)"></textarea>
      </div>

      <button class="btn btn-primary btn-full" id="btn-save">Enregistrer</button>
      <p id="save-msg" style="margin-top:0.8rem; font-size:0.85rem; color:var(--encre-soft);"></p>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/brand.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/session.js"></script>
<script>
  const dossierId = new URLSearchParams(window.location.search).get('id');

  const labels = {
    type_logement: 'Type de logement', piece_concernee: 'Pièce concernée', ville: 'Ville',
    surface_m2: 'Surface', probleme_principal: 'Problème principal',
    elements_a_conserver: 'Éléments à conserver', style_recherche: 'Style recherché',
    budget: 'Budget', calendrier: 'Calendrier', email_prospect: 'Email',
    telephone_prospect: 'Téléphone', scan_provider: 'Source du relevé',
    confidence_score: 'Niveau de confiance'
  };

  function handleAuthError(err) {
    if (String(err.message).includes('Authentification') || String(err.message).includes('Session')) {
      window.location.href = 'login.html';
      return true;
    }
    return false;
  }

  function formatMime(type) {
    const map = {
      'application/pdf': 'PDF',
      'model/vnd.usdz+zip': 'Modèle 3D (USDZ)',
      'image/jpeg': 'Image JPEG',
      'image/png': 'Image PNG',
      'image/webp': 'Image WebP'
    };
    return map[type] || type || 'Format inconnu';
  }

  async function renderDocuments(documents) {
    const container = document.getElementById('documents-list');
    if (!documents || documents.length === 0) {
      container.innerHTML = '<p style="font-size:0.85rem;color:var(--encre-soft);">Aucun plan ni document supplémentaire.</p>';
      return;
    }
    container.innerHTML = '';
    for (const doc of documents) {
      const row = document.createElement('div');
      row.className = 'doc-row';
      row.innerHTML = `
        <div class="doc-info">
          <span class="doc-name">${escapeHtml(doc.nom_original || 'Document')}</span>
          <span class="doc-meta">${escapeHtml(formatMime(doc.type_mime))}</span>
        </div>
        <span class="doc-meta">Chargement du lien…</span>
      `;
      container.appendChild(row);

      try {
        const { signedUrl } = await apiGet(`/api/signed-url?path=${encodeURIComponent(doc.storage_path)}`, { headers: await getAdminAuthHeaders() });
        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '0.6rem';

        const viewLink = document.createElement('a');
        viewLink.href = signedUrl;
        viewLink.target = '_blank';
        viewLink.rel = 'noopener noreferrer';
        viewLink.className = 'btn btn-outline doc-action';
        viewLink.textContent = 'Consulter';

        const downloadLink = document.createElement('a');
        downloadLink.href = signedUrl;
        downloadLink.download = doc.nom_original || 'document';
        downloadLink.className = 'btn btn-outline doc-action';
        downloadLink.textContent = 'Télécharger';

        actions.appendChild(viewLink);
        actions.appendChild(downloadLink);
        row.replaceChild(actions, row.lastElementChild);
      } catch (err) {
        row.lastElementChild.textContent = 'Lien indisponible';
      }
    }
  }


  async function loadDossier() {
    try {
      const data = await apiGet(`/api/dossiers?id=${dossierId}`, { headers: await getAdminAuthHeaders() });
      await renderDossier(data);
    } catch (err) {
      if (handleAuthError(err)) return;
      document.getElementById('dossier-nom').textContent = 'Dossier introuvable';
    }
  }

  async function renderDossier(d) {
    document.getElementById('dossier-nom').textContent = d.nom_prospect || 'Sans nom';
    document.getElementById('dossier-date').textContent =
      `Reçu le ${formatParisDate(d.created_at)} — code ${d.code_acces}`;

    const photoGrid = document.getElementById('photo-grid');
    photoGrid.innerHTML = '';
    if (!d.photos || d.photos.length === 0) {
      photoGrid.innerHTML = '<p style="font-size:0.85rem;color:var(--encre-soft);">Aucune photo</p>';
    } else {
      for (const p of d.photos) {
        const el = document.createElement('div');
        if (p.storage_path) {
          try {
            const { signedUrl } = await apiGet(`/api/signed-url?path=${encodeURIComponent(p.storage_path)}`, { headers: await getAdminAuthHeaders() });
            el.innerHTML = `<img src="${signedUrl}" alt="${escapeHtml(p.legende || '')}">`;
          } catch {
            el.innerHTML = `<div class="placeholder">${escapeHtml(p.legende || 'Photo')}</div>`;
          }
        } else if (p.url) {
          // Rétrocompatibilité avec les dossiers créés avant la migration Storage
          el.innerHTML = `<img src="${p.url}" alt="${escapeHtml(p.legende || '')}">`;
        }
        photoGrid.appendChild(el);
      }
    }

    const mesuresBlock = document.getElementById('mesures-block');
    mesuresBlock.innerHTML = (d.mesures || []).map(m =>
      `<div class="info-line"><span>${escapeHtml(m.libelle)}</span><span>${escapeHtml(m.valeur_cm)} cm</span></div>`
    ).join('') || '<p style="font-size:0.85rem;color:var(--encre-soft);">Aucune mesure</p>';

    await renderDocuments(d.documents || []);

    const infosBlock = document.getElementById('infos-block');
    infosBlock.innerHTML = Object.entries(labels).map(([key, label]) => {
      if (!d[key] && d[key] !== 0) return '';
      return `<div class="info-line"><span>${escapeHtml(label)}</span><span>${escapeHtml(d[key])}</span></div>`;
    }).join('');

    document.getElementById('statut-select').value = d.statut || 'Nouveau';
    document.getElementById('prochaine-action').value = d.prochaine_action || '';

    const notesHistory = document.getElementById('notes-history');
    notesHistory.innerHTML = (d.notes_historique || []).map(n => `
      <div class="note-entry"><span class="date">${formatParisDate(n.created_at)}</span>${escapeHtml(n.contenu)}</div>
    `).join('') || '<p style="font-size:0.8rem;color:var(--encre-soft);">Aucune note pour le moment.</p>';

    if (d.resume_ia) {
      document.getElementById('ia-box').style.display = 'block';
      document.getElementById('ia-box').textContent = d.resume_ia;
    }
  }

  document.querySelectorAll('.ia-actions button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const action = btn.dataset.action;
      const box = document.getElementById('ia-box');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Génération…';
      box.style.display = 'block';
      box.textContent = 'Génération en cours…';
      try {
        if (action === 'resume') {
          const result = await apiPost('/api/summary', { dossier_id: dossierId }, { headers: await getAdminAuthHeaders() });
          box.textContent = result.resume;
        } else {
          const result = await apiPost('/api/analyze', { dossier_id: dossierId, action }, { headers: await getAdminAuthHeaders() });
          box.textContent = result.resultat;
        }
      } catch (err) {
        if (handleAuthError(err)) return;
        box.textContent = err.message || "Le service IA est momentanément indisponible.";
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  });

  document.getElementById('btn-save').addEventListener('click', async () => {
    const saveMsg = document.getElementById('save-msg');
    saveMsg.textContent = 'Enregistrement…';
    try {
      await apiPatch(`/api/status`, {
        dossier_id: dossierId,
        statut: document.getElementById('statut-select').value,
        prochaine_action: document.getElementById('prochaine-action').value,
        notes_privees: document.getElementById('notes').value
      }, { headers: await getAdminAuthHeaders() });
      saveMsg.textContent = 'Enregistré.';
      document.getElementById('notes').value = ''; // la note vient d'être ajoutée à l'historique
      loadDossier();
    } catch (err) {
      if (handleAuthError(err)) return;
      saveMsg.textContent = err.message || "Échec de l'enregistrement — réessayez.";
    }
  });

  (async () => {
    await requireAdminSession();
    loadDossier();
  })();
</script>

</body>
</html>
